# Odaklanma Zamanı: tüm platformlar için otomatik derleme.
# GitHub'a her yüklemede (veya Actions sekmesinden "Run workflow" ile) çalışır.
# Çıktılar: Actions → ilgili çalıştırma → "Artifacts" bölümünden indirilir.
#   - ios-ipad-iphone:  imzasız .ipa (Windows'ta Sideloadly ile iPad/iPhone'a yüklenir)
#   - android-apk:      telefona/tablete doğrudan kurulabilen .apk
#   - windows:          Windows uygulaması (.zip, içindeki .exe çalıştırılır)
#   - web:              GitHub Pages üzerinde herkese açık web sitesi (gh-pages dalından yayınlanır)
name: Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  ios:
    name: iPhone / iPad (.ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: iOS derle (imzasız)
        run: flutter build ios --release --no-codesign
      - name: .ipa paketle
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr OdaklanmaZamani.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipad-iphone
          path: OdaklanmaZamani.ipa

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Android derle
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Hata özeti
        if: failure()
        shell: bash
        run: |
          # Hata satırlarını herkese açık bir nota yaz (kayıtlar yalnızca giriş yapanlara açık).
          grep -inE "what went wrong|error:|exception|failed|could not|unresolved|requires" -A4 build.log | grep -v "^--$" | head -80 > err.txt || true
          [ -s err.txt ] || tail -60 build.log > err.txt
          msg=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' err.txt)
          echo "::error title=Android derleme hatası::$msg"
      - run: cp build/app/outputs/flutter-apk/app-release.apk OdaklanmaZamani.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: OdaklanmaZamani.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Paketle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OdaklanmaZamani-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OdaklanmaZamani-Windows.zip

  web:
    name: Web sitesi (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Web derle
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/" --dart-define=BUILD=${GITHUB_SHA::7}
      - name: Paylaşım önizlemesi için site adresini yaz
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          URL="https://$OWNER.github.io/${{ github.event.repository.name }}/"
          sed -i "s#__SITE_URL__#$URL#g" build/web/index.html
          # Tarayıcı eski dosyaları kullanmasın: her yayında dosya adlarına sürüm ekle
          V=${GITHUB_SHA::7}
          sed -i "s#\"mainJsPath\":\"main.dart.js\"#\"mainJsPath\":\"main.dart.js?v=$V\"#" build/web/flutter_bootstrap.js
          sed -i "s#src=\"flutter_bootstrap.js\"#src=\"flutter_bootstrap.js?v=$V\"#" build/web/index.html
          grep -q "main.dart.js?v=$V" build/web/flutter_bootstrap.js
          grep -q "flutter_bootstrap.js?v=$V" build/web/index.html
          rm -rf build/web/canvaskit build/web/flutter.js.map
          touch build/web/.nojekyll
          echo "Site adresi: $URL"
      - name: gh-pages dalına yayınla
        run: |
          cd build/web
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Web sitesi: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" gh-pages
