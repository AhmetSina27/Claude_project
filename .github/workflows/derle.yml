# Odaklanma Zamanı: tüm platformlar için otomatik derleme.
# GitHub'a her yüklemede (veya Actions sekmesinden "Run workflow" ile) çalışır.
# Çıktılar: Actions → ilgili çalıştırma → "Artifacts" bölümünden indirilir.
#   - ios-ipad-iphone:  imzasız .ipa (Windows'ta Sideloadly ile iPad/iPhone'a yüklenir)
#   - android-apk:      telefona/tablete doğrudan kurulabilen .apk
#   - windows:          Windows uygulaması (.zip, içindeki .exe çalıştırılır)
name: Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  ios:
    name: iPhone / iPad (.ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: iOS derle (imzasız)
        run: flutter build ios --release --no-codesign
      - name: .ipa paketle
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr OdaklanmaZamani.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipad-iphone
          path: OdaklanmaZamani.ipa

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk OdaklanmaZamani.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: OdaklanmaZamani.apk

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Paketle
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath OdaklanmaZamani-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OdaklanmaZamani-Windows.zip
